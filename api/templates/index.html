<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="{{url_for('static', filename='img/logo/logo.png')}}">
  <link rel="stylesheet" href="{{url_for('static', filename='css/reset.css')}}">
  <link rel="stylesheet" href="{{url_for('static', filename='css/styles.css')}}">
  <title>CellShop | Início</title>
</head>
<body id="topo">
  <header class="cabecalho">
    <a href="{{url_for('index')}}" class="cabecalho__logo">
      <img class="cabecalho__logo__imagem" src="{{url_for('static', filename='img/logo/logo.png')}}" alt="Logo da Cell Shop" />
    </a>
    <ul class="cabecalho__links">
      <li><a href="{{url_for('index')}}" style="color: var(--cor-quartenaria);">Home</a>
      <li><a href="{{url_for('pelicula')}}">Peliculas</a>
      <li><a href="{{url_for('capa')}}">Capas</a>
      <li><a href="{{url_for('fone')}}">Fones</a>
      <li><a href="{{url_for('carregador')}}">Carregadores</a>
      <li><a href="{{url_for('cabo_adaptador')}}">Cabos e Adaptadores</a> 
      <li><a href="{{url_for('cadastro')}}">Cadastrar</a>
      <li><a href="{{url_for('buscar')}}">Buscar</a>
    </ul>
  </header>

  <main class="banners">
    <div class="banners__item">
      <img src="{{url_for('static', filename='img/banners/banner-capinhas-semfundo.png')}}" alt="banner ilustrativo de capinhas de diversos tipos" >
      <h2>Encontre o que mais combina com você!</h2>
    </div>
    <div class="banners__item__full">
      <a href="{{url_for('pelicula')}}">
        <img src="{{url_for('static', filename='img/banners/banner-promo-top1.png')}}" alt="banner de divulgação da CellShop, numero um em vendas!" >
      </a>
    </div>
    <div class="banners__item__full">
      <a href="{{url_for('buscar')}}">
        <img src="{{url_for('static', filename='img/banners/banner-cupom-19.png')}}" alt="banner de divulgação desconto de 19 porcento na primeira compra!" >
      </a>
    </div>
  </main>

  <footer class="rodape">
    <a href="{{url_for('index')}}" class="cabecalho__logo">
      <img class="rodape__logo" src="{{url_for('static', filename='img/logo/logo.png')}}" alt="Logo da Cell Shop" />
    </a>
    <div class="rodape__dados">
      <a href="#topo">
        <img class="rodape__icone" src="{{url_for('static', filename='img/icons/seta-para-cima.png')}}" alt="icone de voltar ao topo da tela" />
      </a>
      <div>
        <p>Todos os direitos reservados CellShop @2025</p>
        <p>Equipe da CellShop - <a href="#"><ins>ADS MOD III/IV</ins></a></p>
        <p>Agradecemos á preferencia!</p>
      </div>
    </div>
  </footer>

</body>
</html>
